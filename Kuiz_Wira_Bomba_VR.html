    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 2D Overlay UI */
        .ui-overlay {
            position: absolute;
            z-index: 10;
            pointer-events: auto;
        }

        /* VR Crosshair Reticle */
        .reticle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* In SBS Mode, duplicate crosshair for left and right eyes */
        .sbs-reticle-left {
            position: absolute;
            top: 50%;
            left: 25%;
            transform: translate(-50%, -50%);
        }
        .sbs-reticle-right {
            position: absolute;
            top: 50%;
            left: 75%;
            transform: translate(-50%, -50%);
        }

        .reticle-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 12px rgba(239, 68, 68, 0.8);
        }

        .reticle-ring {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ef4444;
            transform: rotate(-90deg);
            transition: stroke-dashoffset 0.1s linear;
        }

        /* Dual View Splitter Line for VR Box SBS */
        .sbs-divider {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: rgba(255, 255, 255, 0.2);
            z-index: 15;
            display: none;
        }

        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(239, 68, 68, 0.5);
            border-radius: 3px;
        }
    </style>
</head>

    <!-- Audio Synth Logic -->
    <script>
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playBeep(freq = 440, duration = 0.08) {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playCorrect() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                // Fanfare notes: C5, E5, G5, C6
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.3);
                });
            }

            playWrong() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            playWaterSpray() {
                if (this.muted) return;
                this.init();
                // White noise generator for water spray
                const bufferSize = this.ctx.sampleRate * 0.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                filter.Q.value = 1.0;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }

            playSiren() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(900, now + 0.25);
                osc.frequency.linearRampToValueAtTime(600, now + 0.5);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        const sfx = new SoundEffects();
    </script>

    <script>
        // Global State
        let scene, camera, renderer;
        let isVRMode = false;
        let selectedLevel = 1;
        let currentQuestionIdx = 0;
        let score = 0;
        let isGazing = false;
        let gazeTarget = null;
        let gazeTimer = 0;
        const GAZE_DURATION = 2.0; // 2 Seconds Gaze to Select
        let gazeProgress = 0;

        // Interactive 3D Objects Array
        let interactiveObjects = [];
        let raycaster = new THREE.Raycaster();
        let centerVector = new THREE.Vector2(0, 0);

        // Particle Systems
        let fireParticles = [];
        let waterParticles = [];

        // Device Orientation / Touch Look Controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        let gyroOrientation = { alpha: 0, beta: 0, gamma: 0 };
        let hasGyro = false;

        // UI Element References
        const gazeProgressSingle = document.getElementById('gaze-progress-single');
        const gazeProgressLeft = document.getElementById('gaze-progress-left');
        const gazeProgressRight = document.getElementById('gaze-progress-right');
        const singleReticle = document.getElementById('single-reticle');
        const sbsReticles = document.getElementById('sbs-reticles');
        const sbsDivider = document.getElementById('sbs-divider');
        const btnToggleVR = document.getElementById('btn-toggle-vr');
        const vrBtnLabel = document.getElementById('vr-btn-label');
        const mainMenuOverlay = document.getElementById('main-menu-overlay');

        // Init Engine on Load
        window.addEventListener('load', () => {
            init3DScene();
            setupEventListeners();
            animate();
        });

        function init3DScene() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e17);
            scene.fog = new THREE.FogExp2(0x0a0e17, 0.025);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0); // Average human eye level 1.6m

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting Environment
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffaa44, 1.2);
            mainLight.position.set(5, 12, 5);
            mainLight.castShadow = true;
            scene.add(mainLight);

            // Point Lights for Fire Atmosphere
            const fireLight = new THREE.PointLight(0xff5500, 2, 15);
            fireLight.position.set(0, 3, -6);
            scene.add(fireLight);

            // Environment Floor & Station Scenery
            createEnvironment();

            // Resize Event
            window.addEventListener('resize', onWindowResize);
        }

        function createEnvironment() {
            // Floor Grid / Asphalt Texture Simulation
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x1a202c,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Circular Base Stage
            const stageGeo = new THREE.CylinderGeometry(8, 8.5, 0.4, 32);
            const stageMat = new THREE.MeshStandardMaterial({
                color: 0x2d3748,
                metalness: 0.5,
                roughness: 0.4
            });
            const stage = new THREE.Mesh(stageGeo, stageMat);
            stage.position.y = -0.2;
            scene.add(stage);

            // Fire Station Props (Extinguishers, Rescue Cones, Fire Truck Silhouette)
            createFireTruckDecoration();
            create3DFireExtinguisher(-5, 0, -3);
            create3DFireExtinguisher(5, 0, -3);
            createDecorativeParticles();
        }

        function createFireTruckDecoration() {
            // Stylized 3D Fire Truck in background (-12m z)
            const truckGroup = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.BoxGeometry(4, 3, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3 }); // Red-Orange
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 2;
            truckGroup.add(body);

            // Cabin Top
            const cabinGeo = new THREE.BoxGeometry(3.8, 1.8, 3);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 4, 2);
            truckGroup.add(cabin);

            // Siren Light
            const sirenGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.4, 16);
            const sirenMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6 });
            const siren = new THREE.Mesh(sirenGeo, sirenMat);
            siren.position.set(0, 5.1, 2);
            truckGroup.add(siren);

            truckGroup.position.set(0, 0, -14);
            scene.add(truckGroup);
        }

        function create3DFireExtinguisher(x, y, z) {
            const extGroup = new THREE.Group();
            
            // Tank Body
            const tankGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.9, 16);
            const tankMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.6, roughness: 0.3 });
            const tank = new THREE.Mesh(tankGeo, tankMat);
            tank.position.y = 0.45;
            extGroup.add(tank);

            // Nozzle / Top
            const topGeo = new THREE.CylinderGeometry(0.08, 0.12, 0.15, 12);
            const topMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 0.95;
            extGroup.add(top);

            extGroup.position.set(x, y, z);
            scene.add(extGroup);
        }

        function createDecorativeParticles() {
            // Ambient ember/fire particle effect
            const particleCount = 60;
            const pGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 20;
                positions[i + 1] = Math.random() * 8;
                positions[i + 2] = (Math.random() - 0.5) * 20;
            }

            pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const pMat = new THREE.PointsMaterial({
                color: 0xff6600,
                size: 0.15,
                transparent: true,
                opacity: 0.8
            });

            const particles = new THREE.Points(pGeo, pMat);
            scene.add(particles);
            fireParticles.push(particles);
        }

        // Generate 3D Canvas Canvas Textures for Question & Answer Cards
        function createTextTexture(text, width = 512, height = 256, bgColor = "#1e293b", textColor = "#ffffff", isHeader = false) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Background Card
            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.roundRect(0, 0, width, height, 24);
            ctx.fill();

            // Border
            ctx.strokeStyle = isHeader ? "#ef4444" : "#3b82f6";
            ctx.lineWidth = 8;
            ctx.stroke();

            // Text Setup
            ctx.fillStyle = textColor;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const fontSize = isHeader ? 28 : 24;
            ctx.font = `bold ${fontSize}px Inter, sans-serif`;

            // Wrap Text Logic
            const words = text.split(' ');
            let line = '';
            const lines = [];
            const maxWidth = width - 40;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            const lineHeight = fontSize * 1.3;
            const startY = (height - (lines.length - 1) * lineHeight) / 2;

            lines.forEach((l, idx) => {
                ctx.fillText(l.trim(), width / 2, startY + (idx * lineHeight));
            });

            return new THREE.CanvasTexture(canvas);
        }

        // Render Current Question 360 Degree Cards
        function renderQuestion360() {
            // Clear existing 3D question cards
            interactiveObjects.forEach(obj => scene.remove(obj));
            interactiveObjects = [];

            const questionsList = QUIZ_DATA[selectedLevel];
            if (currentQuestionIdx >= questionsList.length) {
                renderEndGameScoreboard();
                return;
            }

            const currentQ = questionsList[currentQuestionIdx];

            // 1. QUESTION CARD (Positioned Front - 0° Direction)
            const qTexture = createTextTexture(`SOALAN ${currentQuestionIdx + 1}/${questionsList.length}:\n${currentQ.q}`, 700, 320, "#0f172a", "#f87171", true);
            const qGeo = new THREE.PlaneGeometry(3.5, 1.6);
            const qMat = new THREE.MeshBasicMaterial({ map: qTexture, side: THREE.DoubleSide });
            const qCard = new THREE.Mesh(qGeo, qMat);
            qCard.position.set(0, 2.2, -4.0); // Front center
            scene.add(qCard);

            // 2. ANSWER CARDS (Positioned around player in 360° space)
            // Layout: Front-Left (-35°), Front-Right (+35°), Back-Left (-145°), Back-Right (+145°)
            const angles = [
                -Math.PI / 5,    // Front-Left (~-36°)
                Math.PI / 5,     // Front-Right (~+36°)
                -Math.PI * 0.75, // Back-Left (~-135°)
                Math.PI * 0.75   // Back-Right (~+135°)
            ];

            const colors = ["#1e293b", "#1e293b", "#1e293b", "#1e293b"];

            currentQ.answers.forEach((ansText, i) => {
                const angle = angles[i];
                const distance = 3.8;
                const x = Math.sin(angle) * distance;
                const z = -Math.cos(angle) * distance;

                const ansTexture = createTextTexture(`${String.fromCharCode(65 + i)}) ${ansText}`, 512, 220, colors[i], "#ffffff", false);
                const ansGeo = new THREE.PlaneGeometry(2.4, 1.0);
                const ansMat = new THREE.MeshBasicMaterial({ map: ansTexture, side: THREE.DoubleSide });
                const ansMesh = new THREE.Mesh(ansGeo, ansMat);

                ansMesh.position.set(x, 1.6, z);
                ansMesh.lookAt(0, 1.6, 0); // Always face center player
                ansMesh.rotation.y += Math.PI; // Correct front facing orientation

                // Store metadata for Gaze Interaction
                ansMesh.userData = {
                    isAnswerCard: true,
                    answerIndex: i,
                    isCorrect: (i === currentQ.correct),
                    explanation: currentQ.explain
                };

                scene.add(ansMesh);
                interactiveObjects.push(ansMesh);
            });
        }

        // Final Scoreboard Screen in 3D
        function renderEndGameScoreboard() {
            interactiveObjects.forEach(obj => scene.remove(obj));
            interactiveObjects = [];

            const total = QUIZ_DATA[selectedLevel].length;
            const percentage = Math.round((score / total) * 100);

            let badgeTitle = "Wira Bomba Junior";
            if (selectedLevel === 2) badgeTitle = "Pegawai Bomba VR";
            if (selectedLevel === 3) badgeTitle = "Komander Penyelamat VR";

            const scoreText = `TAHNIAH! Selesai!\nSkor Anda: ${score}/${total} (${percentage}%)\nGelaran: ${badgeTitle}`;
            const scoreTexture = createTextTexture(scoreText, 700, 360, "#064e3b", "#34d399", true);
            
            const boardGeo = new THREE.PlaneGeometry(3.6, 1.8);
            const boardMat = new THREE.MeshBasicMaterial({ map: scoreTexture, side: THREE.DoubleSide });
            const boardMesh = new THREE.Mesh(boardGeo, boardMat);
            boardMesh.position.set(0, 2.0, -3.5);
            scene.add(boardMesh);

            // Replay Button Card
            const replayTexture = createTextTexture("🔄 PANDANG SINI UNTUK MAIN SEMULA", 512, 180, "#dc2626", "#ffffff", false);
            const btnGeo = new THREE.PlaneGeometry(2.5, 0.9);
            const btnMat = new THREE.MeshBasicMaterial({ map: replayTexture, side: THREE.DoubleSide });
            const btnMesh = new THREE.Mesh(btnGeo, btnMat);
            btnMesh.position.set(0, 0.8, -3.5);
            btnMesh.userData = { isReplayButton: true };

            scene.add(btnMesh);
            interactiveObjects.push(btnMesh);

            sfx.playCorrect();
        }

        // Raycasting Gaze Control Loop
        function checkGazeInteraction(deltaTime) {
            // Update Raycaster from center of screen
            raycaster.setFromCamera(centerVector, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects);

            if (intersects.length > 0) {
                const target = intersects[0].object;

                if (gazeTarget === target) {
                    // Accumulate Gaze Time
                    gazeTimer += deltaTime;
                    gazeProgress = Math.min((gazeTimer / GAZE_DURATION) * 100, 100);

                    // Update visual SVG circle progress
                    updateGazeUI(gazeProgress);

                    // Sound Beep pulse
                    if (Math.floor(gazeTimer * 5) > Math.floor((gazeTimer - deltaTime) * 5)) {
                        sfx.playBeep(400 + gazeProgress * 4, 0.05);
                    }

                    // Trigger Selection on 100% (2 Seconds)
                    if (gazeTimer >= GAZE_DURATION) {
                        onGazeSelect(target);
                        resetGaze();
                    }
                } else {
                    gazeTarget = target;
                    gazeTimer = 0;
                }
            } else {
                resetGaze();
            }
        }

        function resetGaze() {
            gazeTarget = null;
            gazeTimer = 0;
            gazeProgress = 0;
            updateGazeUI(0);
        }

        function updateGazeUI(percent) {
            const dashArray = `${percent}, 100`;
            if (gazeProgressSingle) gazeProgressSingle.setAttribute('stroke-dasharray', dashArray);
            if (gazeProgressLeft) gazeProgressLeft.setAttribute('stroke-dasharray', dashArray);
            if (gazeProgressRight) gazeProgressRight.setAttribute('stroke-dasharray', dashArray);
        }

        // Handle Gaze Selection Trigger
        function onGazeSelect(targetMesh) {
            if (targetMesh.userData.isAnswerCard) {
                const isCorrect = targetMesh.userData.isCorrect;

                if (isCorrect) {
                    score++;
                    sfx.playCorrect();
                    sfx.playWaterSpray();
                    spawnWaterEffect(targetMesh.position);
                } else {
                    sfx.playWrong();
                }

                // Move to next question after short delay
                setTimeout(() => {
                    currentQuestionIdx++;
                    renderQuestion360();
                }, 1200);
            } else if (targetMesh.userData.isReplayButton) {
                // Restart Game
                currentQuestionIdx = 0;
                score = 0;
                renderQuestion360();
            }
        }

        function spawnWaterEffect(pos) {
            // Visual water splash animation
            const splashGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const splashMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 });
            const splash = new THREE.Mesh(splashGeo, splashMat);
            splash.position.copy(pos);
            scene.add(splash);

            let scale = 1;
            const anim = setInterval(() => {
                scale += 0.2;
                splash.scale.set(scale, scale, scale);
                splash.material.opacity -= 0.1;
                if (splash.material.opacity <= 0) {
                    clearInterval(anim);
                    scene.remove(splash);
                }
            }, 30);
        }

        // Controls & Input Event Listeners
        function setupEventListeners() {
            // Level Selector Buttons
            document.querySelectorAll('.btn-level-select').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.btn-level-select').forEach(b => b.classList.remove('border-2', 'border-red-500'));
                    const targetBtn = e.currentTarget;
                    targetBtn.classList.add('border-2', 'border-red-500');
                    selectedLevel = parseInt(targetBtn.getAttribute('data-level'));
                });
            });

            // Start Game Button
            document.getElementById('btn-start-game').addEventListener('click', () => {
                sfx.init();
                sfx.playSiren();
                mainMenuOverlay.classList.add('hidden');
                
                // Request Gyro Permission for Mobile Devices (iOS requirement)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                window.addEventListener('deviceorientation', handleGyro);
                            }
                        })
                        .catch(console.error);
                } else {
                    window.addEventListener('deviceorientation', handleGyro);
                }

                // Render First Question
                currentQuestionIdx = 0;
                score = 0;
                renderQuestion360();
            });

            // Toggle Sound
            document.getElementById('btn-toggle-sound').addEventListener('click', () => {
                sfx.muted = !sfx.muted;
                const icon = document.getElementById('icon-sound');
                icon.className = sfx.muted ? "fa-solid fa-volume-xmark text-lg text-red-400" : "fa-solid fa-volume-high text-lg text-green-400";
            });

            // Toggle VR SBS Stereo Mode
            btnToggleVR.addEventListener('click', toggleVRMode);

            // Re-center Camera Orientation
            document.getElementById('btn-re-center').addEventListener('click', () => {
                cameraEuler.set(0, 0, 0, 'YXZ');
                camera.quaternion.setFromEuler(cameraEuler);
            });

            // Drag to Rotate Look (Touch/Mouse Fallback for Non-Gyro)
            const container = document.getElementById('canvas-container');
            container.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            container.addEventListener('pointermove', (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                cameraEuler.y -= deltaX * 0.003;
                cameraEuler.x -= deltaY * 0.003;
                cameraEuler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, cameraEuler.x));

                camera.quaternion.setFromEuler(cameraEuler);
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointerup', () => isDragging = false);
        }

        // Gyroscope Device Orientation Handler
        function handleGyro(event) {
            if (!event.alpha && !event.beta) return;
            hasGyro = true;

            const alpha = THREE.MathUtils.degToRad(event.alpha || 0);
            const beta = THREE.MathUtils.degToRad(event.beta || 0);
            const gamma = THREE.MathUtils.degToRad(event.gamma || 0);

            // Simple Gyro Orientation Mapping
            const orient = window.orientation || 0;
            if (orient === 90 || orient === -90) {
                camera.quaternion.setFromEuler(new THREE.Euler(beta, alpha, -gamma, 'YXZ'));
            } else {
                camera.quaternion.setFromEuler(new THREE.Euler(beta, alpha, 0, 'YXZ'));
            }
        }

        // Toggle VR Box Side-by-Side (SBS) Stereoscopic Rendering
        function toggleVRMode() {
            isVRMode = !isVRMode;

            if (isVRMode) {
                vrBtnLabel.textContent = "Mod Biasa (Normal)";
                singleReticle.classList.add('hidden');
                sbsReticles.classList.remove('hidden');
                sbsDivider.style.display = 'block';

                // Try entering fullscreen for immersive VR Box experience
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            } else {
                vrBtnLabel.textContent = "Mod VR Box (SBS)";
                singleReticle.classList.remove('hidden');
                sbsReticles.classList.add('hidden');
                sbsDivider.style.display = 'none';

                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
            }
            onWindowResize();
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // Main Animation Loop
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();

            // Gaze Interaction Check
            if (mainMenuOverlay.classList.contains('hidden')) {
                checkGazeInteraction(deltaTime);
            }

            // Animate Fire Particles
            fireParticles.forEach(pSystem => {
                const positions = pSystem.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] += deltaTime * 0.8;
                    if (positions[i] > 8) positions[i] = 0;
                }
                pSystem.geometry.attributes.position.needsUpdate = true;
            });

            // Render Scene (Stereoscopic Dual-Eye in SBS VR Mode vs Normal Single View)
            if (isVRMode) {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const halfWidth = width / 2;

                renderer.setScissorTest(true);

                // LEFT EYE RENDER
                renderer.setScissor(0, 0, halfWidth, height);
                renderer.setViewport(0, 0, halfWidth, height);
                camera.aspect = halfWidth / height;
                camera.updateProjectionMatrix();
                camera.position.x = -0.035; // IPD offset left
                renderer.render(scene, camera);

                // RIGHT EYE RENDER
                renderer.setScissor(halfWidth, 0, halfWidth, height);
                renderer.setViewport(halfWidth, 0, halfWidth, height);
                camera.aspect = halfWidth / height;
                camera.updateProjectionMatrix();
                camera.position.x = 0.035; // IPD offset right
                renderer.render(scene, camera);

                renderer.setScissorTest(false);
                camera.position.x = 0; // Reset center camera position
            } else {
                renderer.render(scene, camera);
            }
        }
    </script>
